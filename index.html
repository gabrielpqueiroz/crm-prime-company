<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prime Company · CRM</title>
<link rel="icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --coffee-900:#241813;
  --coffee-800:#33231a;
  --coffee-700:#4a3526;
  --coffee-600:#5c4636;
  --coffee-500:#6f583f;
  --cream:#f7f1e8;
  --paper:#fbf8f3;
  --paper-2:#f3ece1;
  --gold:#c2a063;
  --gold-soft:#d9c39a;
  --line:#e6dccc;
  --ink:#2c2018;
  --ink-soft:#7a6a59;
  --green:#5d8a5e;
  --green-bg:#e9f1e7;
  --red:#b4524a;
  --red-bg:#f6e7e4;
  --blue:#5b7a96;
  --amber:#c69749;
  --shadow:0 1px 2px rgba(45,32,20,.06),0 8px 24px rgba(45,32,20,.06);
  --shadow-lg:0 18px 50px rgba(45,32,20,.18);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  display:flex;
  min-height:100vh;
}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::selection{background:var(--gold-soft)}

/* ============ SIDEBAR ============ */
.sidebar{
  width:248px;flex-shrink:0;background:var(--coffee-800);color:var(--cream);
  display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 22px}
.brand img{width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.brand .b-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;line-height:1;letter-spacing:.5px}
.brand .b-sub{font-size:10px;letter-spacing:3px;color:var(--gold-soft);text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.nav button{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;
  color:#e9ddca;font-size:14px;font-weight:500;text-align:left;transition:.15s;width:100%;
}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.active{background:var(--coffee-600);color:#fff}
.nav button .ic{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav .badge{margin-left:auto;background:var(--gold);color:var(--coffee-900);font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}
.sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px}
.sidebar-foot button{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#cdbfa9;padding:8px 10px;border-radius:8px}
.sidebar-foot button:hover{background:rgba(255,255,255,.06);color:#fff}
.user-chip{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--gold-soft);padding:6px 10px;margin-bottom:4px}
.user-chip .u-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 0 3px rgba(93,138,94,.25)}

/* ============ MAIN ============ */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;gap:16px;padding:18px 30px;border-bottom:1px solid var(--line);
  background:rgba(251,248,243,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;
}
.topbar .page-title{font-size:27px;font-weight:700;letter-spacing:.3px}
.topbar .page-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.search{
  margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;width:230px;transition:.15s;
}
.search:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,160,99,.13)}
.search input{border:none;outline:none;background:none;width:100%}
.search svg{opacity:.5;flex-shrink:0}
.btn{
  display:inline-flex;align-items:center;gap:7px;background:var(--coffee-700);color:#fff;
  padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;transition:.15s;white-space:nowrap;
}
.btn:hover{background:var(--coffee-600)}
.btn.ghost{background:#fff;color:var(--coffee-700);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--paper-2)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn:disabled{opacity:.6;cursor:default}
.content{padding:26px 30px 60px;overflow-y:auto}

/* ============ DASHBOARD ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:var(--paper-2);opacity:.6}
.kpi .k-label{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.6px;position:relative}
.kpi .k-val{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:700;line-height:1.05;margin-top:8px;position:relative}
.kpi .k-foot{font-size:12px;color:var(--ink-soft);margin-top:6px;position:relative}
.kpi .k-foot b{color:var(--green)}
.dash-row{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-h h3{font-size:20px;font-weight:600}
.card-b{padding:18px 20px}
.funnel-stage{margin-bottom:14px}
.funnel-stage:last-child{margin-bottom:0}
.funnel-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.funnel-top .fs-name{font-weight:600}
.funnel-top .fs-meta{color:var(--ink-soft)}
.funnel-bar{height:11px;border-radius:6px;background:var(--paper-2);overflow:hidden}
.funnel-bar > span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--coffee-600),var(--gold));transition:width .5s}
.src-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.src-row:last-child{border-bottom:none}
.src-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.src-row .s-name{font-weight:500}
.src-row .s-val{margin-left:auto;font-weight:700}
.src-row .s-bar{flex:1;height:7px;border-radius:5px;background:var(--paper-2);overflow:hidden;max-width:120px}
.src-row .s-bar>span{display:block;height:100%}
.mini-list{display:flex;flex-direction:column}
.mini-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.mini-item:last-child{border-bottom:none}
.mini-item .mi-date{width:46px;text-align:center;flex-shrink:0}
.mini-item .mi-date .d-day{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;line-height:1}
.mini-item .mi-date .d-mon{font-size:10px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:1px}
.mini-item .mi-body{min-width:0;flex:1}
.mini-item .mi-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-item .mi-sub{font-size:12px;color:var(--ink-soft)}
.tag-late{color:var(--red);font-weight:700;font-size:11px}

/* ============ PIPELINE ============ */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{background:var(--paper-2);border-radius:var(--radius);width:268px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.col-h{padding:13px 15px;display:flex;align-items:center;gap:8px;position:sticky;top:0}
.col-h .c-dot{width:9px;height:9px;border-radius:50%}
.col-h .c-name{font-weight:700;font-size:13.5px}
.col-h .c-count{margin-left:auto;background:#fff;color:var(--ink-soft);font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:20px;border:1px solid var(--line)}
.col-sum{padding:0 15px 10px;font-size:11.5px;color:var(--ink-soft);font-weight:600}
.col-body{padding:0 10px 12px;overflow-y:auto;flex:1;min-height:60px}
.col-body.drop{outline:2px dashed var(--gold);outline-offset:-4px;border-radius:10px;background:rgba(194,160,99,.07)}
.lead-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:9px;box-shadow:0 1px 2px rgba(45,32,20,.05);cursor:grab;transition:.12s;border-left:3px solid var(--gold-soft)}
.lead-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.lead-card.dragging{opacity:.5;cursor:grabbing}
.lead-card.hot{border-left-color:var(--red)}
.lead-card.warm{border-left-color:var(--amber)}
.lead-card.cold{border-left-color:var(--blue)}
.lc-top{display:flex;align-items:flex-start;gap:8px}
.lc-name{font-weight:700;font-size:14px;line-height:1.2}
.lc-comp{font-size:12px;color:var(--ink-soft);margin-top:1px}
.lc-temp{margin-left:auto;font-size:14px;flex-shrink:0}
.lc-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--paper-2);color:var(--ink-soft)}
.chip.val{background:var(--green-bg);color:var(--green)}
.chip.src{background:#ece4f3;color:#7159a0}
.lc-foot{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;color:var(--ink-soft)}
.lc-foot .fu-late{color:var(--red);font-weight:700}

/* ============ TABLE ============ */
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);font-weight:700;padding:13px 16px;background:var(--paper);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:.1s}
tbody tr:hover{background:var(--paper)}
.t-name{font-weight:600}
.t-comp{font-size:12px;color:var(--ink-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill .p-dot{width:7px;height:7px;border-radius:50%}
.filters{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filters select{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--ink);outline:none;cursor:pointer}
.filters select:focus{border-color:var(--gold)}

/* ============ AGENDA ============ */
.agenda-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fu-item{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.fu-item:last-child{border-bottom:none}
.fu-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
.fu-check:hover{border-color:var(--green)}
.fu-body{flex:1;min-width:0}
.fu-name{font-weight:600}
.fu-sub{font-size:12px;color:var(--ink-soft);margin-top:1px}
.fu-when{font-size:12px;font-weight:700;text-align:right;flex-shrink:0}
.fu-when.late{color:var(--red)}
.fu-when.today{color:var(--amber)}
.fu-when.soon{color:var(--green)}

/* ============ MODAL ============ */
.overlay{position:fixed;inset:0;background:rgba(36,24,19,.5);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--paper);border-radius:18px;width:100%;max-width:680px;box-shadow:var(--shadow-lg);animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:none}}
.modal-h{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-h h2{font-size:24px;font-weight:700;flex:1}
.modal-h .close{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-soft)}
.modal-h .close:hover{background:var(--red-bg);color:var(--red)}
.modal-b{padding:22px 26px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld label{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px}
.fld input,.fld select,.fld textarea{
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);outline:none;transition:.15s;width:100%;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,160,99,.13)}
.fld textarea{resize:vertical;min-height:74px;line-height:1.5}
.modal-f{padding:18px 26px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal-f .btn-del{margin-right:auto;color:var(--red);background:none;font-weight:600;font-size:13px;padding:8px 4px}
.modal-f .btn-del:hover{text-decoration:underline}

/* lead detail */
.detail-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.detail-avatar{width:54px;height:54px;border-radius:13px;background:var(--coffee-700);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;flex-shrink:0}
.detail-info h2{font-size:26px;line-height:1.1}
.detail-info .di-comp{color:var(--ink-soft);font-size:14px;margin-top:2px}
.detail-info .di-tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.contact-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.contact-row a{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:500;color:var(--ink);text-decoration:none;transition:.15s}
.contact-row a:hover{border-color:var(--gold);background:var(--cream)}
.stage-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.stage-picker button{flex:1;min-width:fit-content;font-size:11.5px;font-weight:700;padding:9px 6px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);transition:.15s;white-space:nowrap}
.stage-picker button.on{color:#fff;border-color:transparent}
.detail-section-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-soft);margin:0 0 11px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-bottom:20px}
.dg-item .dgi-l{font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.dg-item .dgi-v{font-weight:600;margin-top:2px}
.activity-add{display:flex;gap:8px;margin-bottom:14px}
.activity-add input{flex:1;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none}
.activity-add input:focus{border-color:var(--gold)}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:15px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--paper)}
.tl-item .tl-txt{font-size:13.5px}
.tl-item .tl-time{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.empty{text-align:center;padding:60px 20px;color:var(--ink-soft)}
.empty .e-ic{font-size:44px;opacity:.4;margin-bottom:10px}
.empty .e-t{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--ink);font-weight:600}
.empty .e-s{margin-top:5px;font-size:13.5px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--coffee-800);color:#fff;padding:12px 22px;border-radius:11px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transition:.3s;z-index:400;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.hide{display:none!important}

/* ============ LOGIN ============ */
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--coffee-700),var(--coffee-900));display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.login-card{background:var(--paper);border-radius:20px;padding:40px 36px;width:100%;max-width:390px;box-shadow:var(--shadow-lg);text-align:center}
.login-card img{width:78px;height:78px;border-radius:50%;margin-bottom:16px;box-shadow:0 0 0 1px var(--line)}
.login-card h1{font-size:32px;line-height:1}
.login-card .l-sub{color:var(--ink-soft);font-size:11px;margin:6px 0 26px;letter-spacing:3px;text-transform:uppercase}
.login-card .fld{text-align:left;margin-bottom:13px}
.login-card .btn{width:100%;justify-content:center;padding:13px;margin-top:8px;font-size:14.5px}
.login-err{color:var(--red);font-size:13px;margin-top:13px;min-height:18px;font-weight:500}
.login-note{font-size:11.5px;color:var(--ink-soft);margin-top:18px;line-height:1.5}
.boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:350;flex-direction:column;gap:16px}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--coffee-700);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:1080px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.dash-row,.agenda-grid{grid-template-columns:1fr}.form-grid,.detail-grid{grid-template-columns:1fr}}
@media(max-width:780px){.sidebar{display:none}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d8ccba;border-radius:8px;border:2px solid var(--paper)}
.col-body::-webkit-scrollbar-thumb{border-color:var(--paper-2)}
</style>
</head>
<body>

<!-- BOOT / LOADING -->
<div class="boot" id="boot"><div class="spinner"></div><div style="color:var(--ink-soft);font-size:13px">Conectando...</div></div>

<!-- LOGIN -->
<div class="login-screen hide" id="loginScreen">
  <div class="login-card">
    <img src="logo.png" alt="Prime Company" onerror="this.style.display='none'"/>
    <h1>Prime Company</h1>
    <div class="l-sub">CRM · Acesso restrito</div>
    <div class="fld"><label>E-mail</label><input id="li_email" type="email" placeholder="voce@primecompany.com" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <div class="fld"><label>Senha</label><input id="li_pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="loginErr"></div>
    <div class="login-note" id="loginNote"></div>
  </div>
</div>

<aside class="sidebar">
  <div class="brand">
    <img src="logo.png" alt="Prime Company" onerror="this.style.display='none'"/>
    <div>
      <div class="b-name">Prime</div>
      <div class="b-sub">Company · CRM</div>
    </div>
  </div>
  <nav class="nav" id="nav">
    <button data-view="dashboard" class="active">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      Dashboard
    </button>
    <button data-view="pipeline">

<script>
/* ===================== SUPABASE CONFIG ===================== */
const SUPABASE_URL='https://umjrjmaxfiaopqpofofz.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVtanJqbWF4Zmlhb3BxcG9mb2Z6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTA3ODQsImV4cCI6MjA5NjA4Njc4NH0.OpFB9MNeEITby3Ig8kZYQNzvNpkMVyoNNAw_aqyZpdA';
const CONFIGURED = !SUPABASE_URL.includes('__SUPABASE');
let sb = CONFIGURED ? supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY) : null;

/* ===================== CONSTANTS ===================== */
const STAGES = [
  {id:'novo',     name:'Novo Lead',         color:'#7159a0'},
  {id:'contato',  name:'Contato Feito',     color:'#5b7a96'},
  {id:'reuniao',  name:'Reunião Agendada',  color:'#c69749'},
  {id:'proposta', name:'Proposta Enviada',  color:'#c2a063'},
  {id:'fechado',  name:'Fechado (Ganho)',   color:'#5d8a5e'},

const SRC_COLORS={'Outbound':'#5b7a96','Inbound':'#5d8a5e','Indicação':'#c69749','Campanha de Tráfego':'#7159a0','Evento':'#b4524a'};
const TEMP={hot:'🔥',warm:'🟡',cold:'❄️'};

let state={leads:[]};
let currentView='dashboard';
let editingId=null, detailId=null;
let sortCol='updated_at', sortDir=-1;
let filterStage='', filterOrigem='';

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function stageOf(id){return STAGES.find(s=>s.id===id)||STAGES[0]}
function money(n){return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ts(x){return x?new Date(x).getTime():0}
function nowISO(){return new Date().toISOString()}

/* ===================== AUTH ===================== */
async function boot(){
  if(!CONFIGURED){
    document.getElementById('boot').classList.add('hide');
    document.getElementById('loginScreen').classList.remove('hide');
    document.getElementById('loginBtn').disabled=true;
    document.getElementById('loginNote').innerHTML='⚙️ Supabase ainda não configurado neste arquivo.';
    return;
  }
  const {data:{session}}=await sb.auth.getSession();
  if(session) await onLogin(session); else showLogin();
}
function showLogin(){
  document.getElementById('boot').classList.add('hide');
  document.getElementById('loginScreen').classList.remove('hide');
  setTimeout(()=>document.getElementById('li_email').focus(),60);
}
async function doLogin(){
  const email=document.getElementById('li_email').value.trim();
  const pass=document.getElementById('li_pass').value;
  const err=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  err.textContent='';
  if(!email||!pass){err.textContent='Preencha e-mail e senha.';return}
  btn.disabled=true;btn.textContent='Entrando...';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  btn.disabled=false;btn.textContent='Entrar';
  if(error){err.textContent='E-mail ou senha incorretos.';return}
  await onLogin(data.session);
}
async function onLogin(session){
  document.getElementById('userEmail').textContent=session.user.email;
  document.getElementById('loginScreen').classList.add('hide');
  document.getElementById('boot').classList.remove('hide');
  await loadLeads();
  document.getElementById('boot').classList.add('hide');
  render();
  subscribeRealtime();
}
async function logout(){
  await sb.auth.signOut();
  location.reload();
}

/* ===================== DATA ===================== */
async function loadLeads(){
  const {data,error}=await sb.from('leads').select('*').order('updated_at',{ascending:false});
  if(error){toast('Erro ao carregar: '+error.message,true);return}
  state.leads=(data||[]).map(l=>({...l,activity:Array.isArray(l.activity)?l.activity:[]}));
}
let reloadTimer=null;
function subscribeRealtime(){
  try{
    sb.channel('leads-rt').on('postgres_changes',{event:'*',schema:'public',table:'leads'},()=>{
      clearTimeout(reloadTimer);
      reloadTimer=setTimeout(async()=>{await loadLeads();render();if(detailId)openDetail(detailId,true)},400);
    }).subscribe();
  }catch(e){/* realtime opcional */}
}
async function dbInsert(row){
  const {data,error}=await sb.from('leads').insert(row).select().single();
  if(error){toast('Erro ao salvar: '+error.message,true);return null}
  return {...data,activity:Array.isArray(data.activity)?data.activity:[]};
}
async function dbUpdate(id,patch){
  const {error}=await sb.from('leads').update(patch).eq('id',id);
  if(error){toast('Erro ao salvar: '+error.message,true);return false}
  return true;
}
async function dbDelete(id){
  const {error}=await sb.from('leads').delete().eq('id',id);
  if(error){toast('Erro ao excluir: '+error.message,true);return false}
  return true;
}

/* ===================== NAV ===================== */
const TITLES={
  dashboard:['Dashboard','Visão geral da operação comercial'],
  pipeline:['Pipeline','Arraste os cards entre as etapas'],
  leads:['Leads','Sua base completa de contatos'],
  agenda:['Agenda & Follow-ups','O que precisa de atenção agora'],
};
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button[data-view]');if(!b)return;
  currentView=b.dataset.view;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));
  document.getElementById('pageTitle').textContent=TITLES[currentView][0];
  document.getElementById('pageSub').textContent=TITLES[currentView][1];
  render();
});
function updateBadges(){
  const active=state.leads.filter(l=>l.stage!=='fechado'&&l.stage!=='perdido').length;
  document.getElementById('navPipeCount').textContent=active;
  const fu=state.leads.filter(l=>l.followup&&l.stage!=='fechado'&&l.stage!=='perdido'&&daysUntil(l.followup)<=0).length;
  const badge=document.getElementById('navFuCount');
  badge.textContent=fu; badge.style.display=fu?'':'none';
}
function daysUntil(d){if(!d)return 9999;const a=new Date(d);a.setHours(0,0,0,0);const b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/86400000)}

/* ===================== RENDER ===================== */
function render(){
  updateBadges();
  const c=document.getElementById('content');
  if(currentView==='dashboard')c.innerHTML=viewDashboard();
  else if(currentView==='pipeline'){c.innerHTML=viewPipeline();wireDnD();}
  else if(currentView==='leads')c.innerHTML=viewLeads();
  else if(currentView==='agenda')c.innerHTML=viewAgenda();
}
function filtered(){
  const q=(document.getElementById('globalSearch').value||'').toLowerCase().trim();
  return state.leads.filter(l=>{
    if(!q)return true;
    return [l.nome,l.empresa,l.email,l.telefone,l.instagram,l.servico,l.campanha].some(v=>(v||'').toLowerCase().includes(q));
  });
}

/* ---------- DASHBOARD ---------- */
function viewDashboard(){
  const L=state.leads;
  if(!L.length)return emptyState('Comece adicionando seu primeiro lead','Clique em “Novo Lead” no topo para cadastrar.');
  const active=L.filter(l=>l.stage!=='fechado'&&l.stage!=='perdido');
  const won=L.filter(l=>l.stage==='fechado');
  const pipeVal=active.reduce((s,l)=>s+(Number(l.valor)||0),0);
  const wonVal=won.reduce((s,l)=>s+(Number(l.valor)||0),0);
  const closedTotal=L.filter(l=>l.stage==='fechado'||l.stage==='perdido').length;
  const convRate=closedTotal?Math.round(won.length/closedTotal*100):0;
  const reunioes=L.filter(l=>l.reuniao&&new Date(l.reuniao)>=new Date()).length;
  const funnel=STAGES.filter(s=>s.id!=='perdido').map(s=>{
    const items=L.filter(l=>l.stage===s.id);
    return {...s,count:items.length,val:items.reduce((a,l)=>a+(Number(l.valor)||0),0)};
  });
  const maxF=Math.max(1,...funnel.map(f=>f.count));
  const srcMap={};L.forEach(l=>{srcMap[l.origem]=(srcMap[l.origem]||0)+1});
  const srcs=Object.entries(srcMap).sort((a,b)=>b[1]-a[1]);
  const maxS=Math.max(1,...srcs.map(s=>s[1]));
  const upcoming=L.filter(l=>l.reuniao&&l.stage!=='perdido').map(l=>({l,d:new Date(l.reuniao)})).filter(x=>x.d>=new Date(Date.now()-86400000)).sort((a,b)=>a.d-b.d).slice(0,5);
  return `
  <div class="kpi-grid">
    <div class="kpi"><div class="k-label">Leads ativos</div><div class="k-val">${active.length}</div><div class="k-foot">${L.length} no total</div></div>
    <div class="kpi"><div class="k-label">Valor no pipeline</div><div class="k-val">${money(pipeVal)}</div><div class="k-foot">em ${active.length} oportunidades</div></div>
    <div class="kpi"><div class="k-label">Fechado</div><div class="k-val" style="color:var(--green)">${money(wonVal)}</div><div class="k-foot"><b>${won.length}</b> negócios ganhos</div></div>
    <div class="kpi"><div class="k-label">Taxa de conversão</div><div class="k-val">${convRate}%</div><div class="k-foot">${reunioes} reuniões futuras</div></div>
  </div>
  <div class="dash-row">
    <div class="card">
      <div class="card-h"><h3>Funil de Vendas</h3><span style="font-size:12px;color:var(--ink-soft)">por etapa</span></div>
      <div class="card-b">
        ${funnel.map(f=>`
          <div class="funnel-stage">
            <div class="funnel-top"><span class="fs-name">${f.name}</span><span class="fs-meta">${f.count} · ${money(f.val)}</span></div>
            <div class="funnel-bar"><span style="width:${f.count/maxF*100}%"></span></div>
          </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>Origem dos Leads</h3></div>
      <div class="card-b">
        ${srcs.length?srcs.map(([n,v])=>`
          <div class="src-row">
            <span class="src-dot" style="background:${SRC_COLORS[n]||'#999'}"></span>
            <span class="s-name">${esc(n)}</span>
            <span class="s-bar"><span style="width:${v/maxS*100}%;background:${SRC_COLORS[n]||'#999'}"></span></span>
            <span class="s-val">${v}</span>
          </div>`).join(''):'<div style="color:var(--ink-soft);font-size:13px">Sem dados ainda.</div>'}
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-h"><h3>Próximas Reuniões</h3><span style="font-size:12px;color:var(--ink-soft)">${upcoming.length} agendada(s)</span></div>
    <div class="card-b">
      ${upcoming.length?`<div class="mini-list">${upcoming.map(({l,d})=>{
        const late=d<new Date()&&d.toDateString()!==new Date().toDateString();
        return `<div class="mini-item" onclick="openDetail('${l.id}')" style="cursor:pointer">
          <div class="mi-date"><div class="d-day">${d.getDate()}</div><div class="d-mon">${d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</div></div>
          <div class="mi-body"><div class="mi-title">${esc(l.nome)}${l.empresa?' · '+esc(l.empresa):''}</div>
          <div class="mi-sub">${d.toLocaleString('pt-BR',{weekday:'long',hour:'2-digit',minute:'2-digit'})} ${late?'<span class="tag-late">· atrasada</span>':''}</div></div>
          <span class="pill" style="background:${stageOf(l.stage).color}1a;color:${stageOf(l.stage).color}"><span class="p-dot" style="background:${stageOf(l.stage).color}"></span>${stageOf(l.stage).name}</span>
        </div>`}).join('')}</div>`:'<div style="color:var(--ink-soft);font-size:13px;padding:8px 0">Nenhuma reunião agendada. Marque uma reunião editando um lead.</div>'}
    </div>
  </div>`;
}

/* ---------- PIPELINE ---------- */
function viewPipeline(){
  const L=filtered();
  return `<div class="board">${STAGES.map(s=>{
    const items=L.filter(l=>l.stage===s.id).sort((a,b)=>ts(b.updated_at)-ts(a.updated_at));
    const val=items.reduce((a,l)=>a+(Number(l.valor)||0),0);
    return `<div class="col">
      <div class="col-h"><span class="c-dot" style="background:${s.color}"></span><span class="c-name">${s.name}</span><span class="c-count">${items.length}</span></div>
      ${val?`<div class="col-sum">${money(val)}</div>`:'<div class="col-sum">&nbsp;</div>'}
      <div class="col-body" data-stage="${s.id}">
        ${items.map(cardHTML).join('')}
      </div>
    </div>`;
  }).join('')}</div>`;
}
function cardHTML(l){
  const fu=l.followup?daysUntil(l.followup):null;
  let fuTxt='';
  if(l.followup&&l.stage!=='fechado'&&l.stage!=='perdido'){
    if(fu<0)fuTxt=`<span class="fu-late">⚑ Follow-up atrasado ${-fu}d</span>`;
    else if(fu===0)fuTxt=`<span class="fu-late">⚑ Follow-up hoje</span>`;
    else fuTxt=`⚑ Follow-up em ${fu}d`;
  }
  return `<div class="lead-card ${l.temp||'warm'}" draggable="true" data-id="${l.id}" onclick="openDetail('${l.id}')">
    <div class="lc-top">
      <div><div class="lc-name">${esc(l.nome)}</div>${l.empresa?`<div class="lc-comp">${esc(l.empresa)}</div>`:''}</div>
      <div class="lc-temp">${TEMP[l.temp||'warm']}</div>
    </div>
    <div class="lc-meta">
      ${l.valor?`<span class="chip val">${money(l.valor)}</span>`:''}
      <span class="chip src">${esc(l.origem||'')}</span>
      ${l.servico?`<span class="chip">${esc(l.servico)}</span>`:''}
    </div>
    ${fuTxt?`<div class="lc-foot">${fuTxt}</div>`:''}
  </div>`;
}
function wireDnD(){
  let dragId=null;
  document.querySelectorAll('.lead-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{dragId=card.dataset.id;card.classList.add('dragging');e.stopPropagation()});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.col-body').forEach(b=>b.classList.remove('drop'))});
  });
  document.querySelectorAll('.col-body').forEach(body=>{
    body.addEventListener('dragover',e=>{e.preventDefault();body.classList.add('drop')});
    body.addEventListener('dragleave',()=>body.classList.remove('drop'));
    body.addEventListener('drop',async e=>{
      e.preventDefault();body.classList.remove('drop');
      const l=state.leads.find(x=>x.id===dragId);
      if(l&&l.stage!==body.dataset.stage){
        const old=stageOf(l.stage).name;
        const activity=[{t:`Movido de "${old}" para "${stageOf(body.dataset.stage).name}"`,at:Date.now()},...(l.activity||[])];
        l.stage=body.dataset.stage;l.updated_at=nowISO();l.activity=activity;
        render();
        await dbUpdate(l.id,{stage:l.stage,updated_at:l.updated_at,activity});
        toast(`${l.nome} → ${stageOf(l.stage).name}`);
      }
    });
  });
}

/* ---------- LEADS TABLE ---------- */
function viewLeads(){
  let L=filtered();
  if(filterStage)L=L.filter(l=>l.stage===filterStage);
  if(filterOrigem)L=L.filter(l=>l.origem===filterOrigem);
  L=L.slice().sort((a,b)=>{
    let va=a[sortCol],vb=b[sortCol];
    if(sortCol==='valor'){va=Number(va)||0;vb=Number(vb)||0}
    else{va=(va||'').toString().toLowerCase();vb=(vb||'').toString().toLowerCase()}
    return va<vb?-sortDir:va>vb?sortDir:0;
  });
  const origens=[...new Set(state.leads.map(l=>l.origem))];
  const filters=`<div class="filters">
    <select onchange="filterStage=this.value;render()">
      <option value="">Todas as etapas</option>
      ${STAGES.map(s=>`<option value="${s.id}" ${filterStage===s.id?'selected':''}>${s.name}</option>`).join('')}
    </select>
    <select onchange="filterOrigem=this.value;render()">
      <option value="">Todas as origens</option>
      ${origens.map(o=>`<option ${filterOrigem===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select>
    <span style="color:var(--ink-soft);font-size:12.5px;margin-left:auto">${L.length} lead(s)</span>
  </div>`;
  if(!state.leads.length)return emptyState('Nenhum lead cadastrado','Adicione seu primeiro lead no botão acima.');
  const head=(c,t)=>`<th onclick="sortBy('${c}')">${t} ${sortCol===c?(sortDir>0?'↑':'↓'):''}</th>`;
  return filters+`<div class="table-wrap"><table>
    <thead><tr>
      ${head('nome','Lead')}${head('origem','Origem')}${head('stage','Etapa')}
      ${head('valor','Valor')}<th>Próx. follow-up</th><th>Contato</th>
    </tr></thead><tbody>
    ${L.map(l=>{
      const s=stageOf(l.stage);const fu=l.followup?daysUntil(l.followup):null;
      const late=fu!==null&&fu<=0&&l.stage!=='fechado'&&l.stage!=='perdido';
      return `<tr onclick="openDetail('${l.id}')">
        <td><div class="t-name">${TEMP[l.temp||'warm']} ${esc(l.nome)}</div>${l.empresa?`<div class="t-comp">${esc(l.empresa)}</div>`:''}</td>
        <td><span class="pill" style="background:${(SRC_COLORS[l.origem]||'#999')}1a;color:${SRC_COLORS[l.origem]||'#999'}"><span class="p-dot" style="background:${SRC_COLORS[l.origem]||'#999'}"></span>${esc(l.origem||'')}</span></td>
        <td><span class="pill" style="background:${s.color}1a;color:${s.color}"><span class="p-dot" style="background:${s.color}"></span>${s.name}</span></td>
        <td style="font-weight:600">${l.valor?money(l.valor):'—'}</td>
        <td>${l.followup?`<span style="${late?'color:var(--red);font-weight:700':''}">${new Date(l.followup+'T00:00').toLocaleDateString('pt-BR')}${late?(fu<0?` (${-fu}d)`:' (hoje)'):''}</span>`:'—'}</td>
        <td>${l.telefone?`<span style="color:var(--ink-soft)">${esc(l.telefone)}</span>`:l.email?`<span style="color:var(--ink-soft)">${esc(l.email)}</span>`:'—'}</td>
      </tr>`;
    }).join('')}
    </tbody></table></div>`;
}
function sortBy(c){if(sortCol===c)sortDir*=-1;else{sortCol=c;sortDir=1}render()}

/* ---------- AGENDA ---------- */
function viewAgenda(){
  const L=state.leads.filter(l=>l.stage!=='fechado'&&l.stage!=='perdido');
  const fus=L.filter(l=>l.followup).map(l=>({l,d:daysUntil(l.followup),date:l.followup})).sort((a,b)=>a.d-b.d);
  const reun=state.leads.filter(l=>l.reuniao&&l.stage!=='perdido').map(l=>({l,dt:new Date(l.reuniao)})).filter(x=>x.dt>=new Date(Date.now()-3*86400000)).sort((a,b)=>a.dt-b.dt);
  if(!state.leads.length)return emptyState('Nada na agenda ainda','Defina follow-ups e reuniões ao cadastrar leads.');
  const fuItem=({l,d,date})=>{
    let cls='soon',txt;
    if(d<0){cls='late';txt=`${-d}d atrás`}else if(d===0){cls='today';txt='Hoje'}else if(d===1){txt='Amanhã'}else{txt=`em ${d}d`}
    return `<div class="fu-item">
      <div class="fu-check" onclick="doneFollowup('${l.id}',event)" title="Marcar follow-up como feito"></div>
      <div class="fu-body" onclick="openDetail('${l.id}')" style="cursor:pointer">
        <div class="fu-name">${esc(l.nome)}${l.empresa?` · ${esc(l.empresa)}`:''}</div>
        <div class="fu-sub">${stageOf(l.stage).name} · ${new Date(date+'T00:00').toLocaleDateString('pt-BR')}</div>
      </div>
      <div class="fu-when ${cls}">${txt}</div>
    </div>`;
  };
  const reItem=({l,dt})=>{
    const d=daysUntil(l.reuniao.slice(0,10));let cls='soon',txt=dt.toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    if(d<0)cls='late';else if(d===0)cls='today';
    return `<div class="fu-item">
      <div class="fu-body" onclick="openDetail('${l.id}')" style="cursor:pointer">
        <div class="fu-name">${esc(l.nome)}${l.empresa?` · ${esc(l.empresa)}`:''}</div>
        <div class="fu-sub">${esc(l.servico||stageOf(l.stage).name)}</div>
      </div>
      <div class="fu-when ${cls}">${txt}</div>
    </div>`;
  };
  return `<div class="agenda-grid">
    <div class="card"><div class="card-h"><h3>Follow-ups</h3><span style="font-size:12px;color:var(--ink-soft)">${fus.length} pendente(s)</span></div>
      <div class="card-b">${fus.length?fus.map(fuItem).join(''):'<div style="color:var(--ink-soft);font-size:13px">Nenhum follow-up agendado. Tudo em dia! ✨</div>'}</div></div>
    <div class="card"><div class="card-h"><h3>Reuniões</h3><span style="font-size:12px;color:var(--ink-soft)">${reun.length}</span></div>
      <div class="card-b">${reun.length?reun.map(reItem).join(''):'<div style="color:var(--ink-soft);font-size:13px">Nenhuma reunião marcada.</div>'}</div></div>
  </div>`;
}
async function doneFollowup(id,e){
  e.stopPropagation();
  const l=state.leads.find(x=>x.id===id);if(!l)return;
  const activity=[{t:`Follow-up concluído (${new Date(l.followup+'T00:00').toLocaleDateString('pt-BR')})`,at:Date.now()},...(l.activity||[])];
  l.activity=activity;l.followup=null;l.updated_at=nowISO();
  render();
  await dbUpdate(id,{followup:null,activity,updated_at:l.updated_at});
  toast('Follow-up concluído ✓');
}

/* ---------- DETAIL ---------- */
function openDetail(id,keepScroll){
  detailId=id;
  const l=state.leads.find(x=>x.id===id);if(!l){closeDetail();return}
  const s=stageOf(l.stage);
  const initials=(l.nome||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const contacts=[];
  if(l.telefone){const num=l.telefone.replace(/\D/g,'');contacts.push(`<a href="https://wa.me/55${num}" target="_blank">💬 WhatsApp</a><a href="tel:${l.telefone}">📞 ${esc(l.telefone)}</a>`)}
  if(l.email)contacts.push(`<a href="mailto:${l.email}">✉️ ${esc(l.email)}</a>`);
  if(l.instagram)contacts.push(`<a href="https://instagram.com/${l.instagram.replace('@','')}" target="_blank">📷 ${esc(l.instagram)}</a>`);
  const dg=(lab,val)=>val?`<div class="dg-item"><div class="dgi-l">${lab}</div><div class="dgi-v">${esc(val)}</div></div>`:'';
  const acts=(l.activity||[]).slice().sort((a,b)=>b.at-a.at);
  document.getElementById('detailBody').innerHTML=`
    <div class="detail-head">
      <div class="detail-avatar">${initials}</div>
      <div class="detail-info" style="flex:1">
        <h2>${esc(l.nome)}</h2>
        ${l.empresa?`<div class="di-comp">${esc(l.empresa)}</div>`:''}
        <div class="di-tags">
          <span class="pill" style="background:${(SRC_COLORS[l.origem]||'#999')}1a;color:${SRC_COLORS[l.origem]||'#999'}">${esc(l.origem||'')}</span>
          <span class="chip">${TEMP[l.temp||'warm']} ${l.temp==='hot'?'Quente':l.temp==='cold'?'Frio':'Morno'}</span>
          ${l.valor?`<span class="chip val">${money(l.valor)}</span>`:''}
        </div>
      </div>
      <button class="btn ghost sm" onclick="openLead('${l.id}')">✎ Editar</button>
    </div>
    ${contacts.length?`<div class="contact-row">${contacts.join('')}</div>`:''}
    <p class="detail-section-t">Etapa do funil</p>
    <div class="stage-picker">${STAGES.map(st=>`<button class="${st.id===l.stage?'on':''}" style="${st.id===l.stage?`background:${st.color}`:''}" onclick="setStage('${l.id}','${st.id}')">${st.name}</button>`).join('')}</div>
    <div class="detail-grid">
      ${dg('Serviço de interesse',l.servico)}
      ${dg('Campanha / Canal',l.campanha)}
      ${dg('Responsável',l.resp)}
      ${l.followup?`<div class="dg-item"><div class="dgi-l">Próximo follow-up</div><div class="dgi-v" style="${daysUntil(l.followup)<=0?'color:var(--red)':''}">${new Date(l.followup+'T00:00').toLocaleDateString('pt-BR')}</div></div>`:''}
      ${l.reuniao?`<div class="dg-item"><div class="dgi-l">Reunião</div><div class="dgi-v">${new Date(l.reuniao).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>`:''}
      <div class="dg-item"><div class="dgi-l">Criado em</div><div class="dgi-v">${l.created_at?new Date(l.created_at).toLocaleDateString('pt-BR'):'—'}</div></div>
    </div>
    ${l.notas?`<p class="detail-section-t">Observações</p><div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;font-size:13.5px;line-height:1.6;margin-bottom:20px;white-space:pre-wrap">${esc(l.notas)}</div>`:''}
    <p class="detail-section-t">Histórico & Anotações</p>
    <div class="activity-add">
      <input id="actInput" placeholder="Registrar interação, ligação, nota..." onkeydown="if(event.key==='Enter')addActivity('${l.id}')"/>
      <button class="btn sm" onclick="addActivity('${l.id}')">Adicionar</button>
    </div>
    ${acts.length?`<div class="timeline">${acts.map(a=>`<div class="tl-item"><div class="tl-txt">${esc(a.t)}</div><div class="tl-time">${new Date(a.at).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')}</div>`:'<div style="color:var(--ink-soft);font-size:13px">Sem registros ainda.</div>'}
  `;
  if(!keepScroll)document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail(){document.getElementById('detailOverlay').classList.remove('open');detailId=null}
async function setStage(id,st){
  const l=state.leads.find(x=>x.id===id);if(!l||l.stage===st)return;
  const old=stageOf(l.stage).name;
  const activity=[{t:`Etapa alterada: "${old}" → "${stageOf(st).name}"`,at:Date.now()},...(l.activity||[])];
  l.stage=st;l.updated_at=nowISO();l.activity=activity;
  openDetail(id,true);render();
  await dbUpdate(id,{stage:st,updated_at:l.updated_at,activity});
  toast(`Etapa: ${stageOf(st).name}`);
}
async function addActivity(id){
  const inp=document.getElementById('actInput');const t=inp.value.trim();if(!t)return;
  const l=state.leads.find(x=>x.id===id);
  const activity=[{t,at:Date.now()},...(l.activity||[])];
  l.activity=activity;l.updated_at=nowISO();
  openDetail(id,true);
  await dbUpdate(id,{activity,updated_at:l.updated_at});
}

/* ---------- FORM ---------- */
function openLead(id){
  document.getElementById('f_stage').innerHTML=STAGES.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  editingId=id||null;
  const F=id=>document.getElementById(id);
  if(editingId){
    const l=state.leads.find(x=>x.id===editingId);
    document.getElementById('formTitle').textContent='Editar Lead';
    document.getElementById('formDelBtn').style.display='';
    F('f_nome').value=l.nome||'';F('f_empresa').value=l.empresa||'';F('f_telefone').value=l.telefone||'';
    F('f_email').value=l.email||'';F('f_instagram').value=l.instagram||'';F('f_origem').value=l.origem||'Outbound';
    F('f_campanha').value=l.campanha||'';F('f_servico').value=l.servico||'';F('f_stage').value=l.stage||'novo';
    F('f_temp').value=l.temp||'warm';F('f_valor').value=l.valor!=null?l.valor:'';F('f_followup').value=l.followup||'';
    F('f_reuniao').value=l.reuniao||'';F('f_resp').value=l.resp||'';F('f_notas').value=l.notas||'';
    closeDetail();
  }else{
    document.getElementById('formTitle').textContent='Novo Lead';
    document.getElementById('formDelBtn').style.display='none';
    ['f_nome','f_empresa','f_telefone','f_email','f_instagram','f_campanha','f_servico','f_valor','f_followup','f_reuniao','f_resp','f_notas'].forEach(i=>F(i).value='');
    F('f_origem').value='Outbound';F('f_stage').value='novo';F('f_temp').value='warm';
  }
  document.getElementById('formOverlay').classList.add('open');
  setTimeout(()=>F('f_nome').focus(),50);
}
function closeForm(){document.getElementById('formOverlay').classList.remove('open')}
function gather(){
  const V=id=>document.getElementById(id).value.trim();
  const vraw=V('f_valor');
  return {
    nome:V('f_nome'),empresa:V('f_empresa'),telefone:V('f_telefone'),email:V('f_email'),instagram:V('f_instagram'),
    origem:V('f_origem'),campanha:V('f_campanha'),servico:V('f_servico'),stage:V('f_stage'),temp:V('f_temp'),
    valor:vraw===''?null:Number(vraw),
    followup:V('f_followup')||null,reuniao:V('f_reuniao')||null,resp:V('f_resp'),notas:V('f_notas'),
  };
}
async function saveLead(){
  const data=gather();
  if(!data.nome){toast('Informe o nome do contato',true);document.getElementById('f_nome').focus();return}
  const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Salvando...';
  if(editingId){
    const patch={...data,updated_at:nowISO()};
    const ok=await dbUpdate(editingId,patch);
    if(ok){const l=state.leads.find(x=>x.id===editingId);Object.assign(l,patch);}
    btn.disabled=false;btn.textContent='Salvar';
    if(!ok)return;
    closeForm();render();toast('Lead atualizado ✓');
  }else{
    const row={...data,activity:[{t:'Lead criado',at:Date.now()}]};
    const created=await dbInsert(row);
    btn.disabled=false;btn.textContent='Salvar';
    if(!created)return;
    state.leads.unshift(created);
    closeForm();render();toast('Lead adicionado ✓');
  }
}
async function deleteCurrent(){
  if(!editingId)return;
  if(!confirm('Excluir este lead permanentemente?'))return;
  const ok=await dbDelete(editingId);
  if(!ok)return;
  state.leads=state.leads.filter(x=>x.id!==editingId);
  closeForm();render();toast('Lead excluído');
}

/* ---------- UTIL ---------- */
function emptyState(t,s){return `<div class="empty"><div class="e-ic">☕</div><div class="e-t">${t}</div><div class="e-s">${s}</div></div>`}
let toastT;
function toast(msg,isErr){const t=document.getElementById('toast');t.textContent=msg;t.classList.toggle('err',!!isErr);t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),isErr?4200:2600)}

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`prime-crm-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
  toast('Backup exportado ✓');
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeForm();closeDetail()}});
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open')}));

/* ===================== INIT ===================== */
boot();
</script>
</body>
</html>
